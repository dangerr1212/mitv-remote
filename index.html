<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт Mi TV</title>
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }
        .input-group {
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
        }
        .remote-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 300px;
        }
        .row {
            display: flex;
            gap: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        button.ok {
            background-color: #ff9800;
        }
        button.power {
            background-color: #f44336;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: gray;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Пульт Xiaomi Mi TV</h2>

    <div class="input-group">
        <label for="tv-ip" style="font-size: 12px; display: block; margin-bottom: 5px;">IP-адрес телевизора:</label>
        <input type="text" id="tv-ip" value="192.168.1.100" placeholder="Например: 192.168.1.50">
    </div>

    <div class="remote-container">
        <!-- Верхний ряд: Питание и Домой -->
        <div class="row">
            <button class="power" onclick="sendKey('KEYCODE_POWER')">⏻</button>
            <button onclick="sendKey('KEYCODE_HOME')">🏠</button>
            <button onclick="sendKey('KEYCODE_BACK')">↩</button>
        </div>

        <!-- Крестовина -->
        <button onclick="sendKey('KEYCODE_DPAD_UP')">▲</button>
        <div class="row">
            <button onclick="sendKey('KEYCODE_DPAD_LEFT')">◀</button>
            <button class="ok" onclick="sendKey('KEYCODE_DPAD_CENTER')">OK</button>
            <button onclick="sendKey('KEYCODE_DPAD_RIGHT')">▶</button>
        </div>
        <button onclick="sendKey('KEYCODE_DPAD_DOWN')">▼</button>

        <!-- Громкость -->
        <div class="row" style="margin-top: 10px;">
            <button onclick="sendKey('KEYCODE_VOLUME_DOWN')">🔉</button>
            <button onclick="sendKey('KEYCODE_VOLUME_UP')">🔊</button>
        </div>
    </div>

    <div id="status" class="status">Готов к работе</div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Укажите ваш адрес бэкенда на Render, который вы получили ранее!
        const BACKEND_URL = "https://mitv-remote-backend.onrender.com/send_command";

        async function sendKey(keyCode) {
            const ip = document.getElementById('tv-ip').value.trim();
            const statusEl = document.getElementById('status');

            if (!ip) {
                statusEl.innerText = "Введите IP-адрес телевизора!";
                return;
            }

            statusEl.innerText = "Отправка...";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ip: ip, key: keyCode })
                });

                if (response.ok) {
                    statusEl.innerText = "Команда отправлена!";
                    // Легкая вибрация телефона при успешном нажатии (если поддерживается Telegram)
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.impactOccurred('light');
                    }
                } else {
                    statusEl.innerText = "Ошибка сервера";
                }
            } catch (error) {
                statusEl.innerText = "Ошибка сети (проверьте ПК-мост)";
                console.error(error);
            }
        }
    </script>
</body>
</html>
